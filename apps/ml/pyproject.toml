[project]
name = "crowdshield-ml"
version = "0.1.0"
description = "CrowdShield model gateway: redaction, Nebius Token Factory, Tavily web intelligence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.150.0",
  "uvicorn>=0.54.0",
  "httpx>=0.28.1",
  "pydantic>=2.14.1",
  "redis>=8.1.0",
  "python-multipart>=0.0.32",
  "pymupdf>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdshield_ml"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls Nebius / Tavily for real (run with -m live)"]
addopts = "-m 'not live'"
asyncio_mode = "auto"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Header", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
