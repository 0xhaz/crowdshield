# Local dev stack (techstacks §12; SeaweedFS stands in for MinIO). Host ports are offset to avoid clashing with other local projects.
name: crowdshield

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crowdshield
      POSTGRES_PASSWORD: crowdshield
      POSTGRES_DB: crowdshield
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdshield -d crowdshield"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object store (MinIO no longer publishes community images). Use path-style S3 URLs.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -volume.max=20 -master.volumeSizeLimitMB=64 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9020:8333"
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'",
        ]
      interval: 3s
      timeout: 5s
      retries: 40

  s3-init:
    image: chrislusf/seaweedfs:latest
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf 's3.bucket.create -name evidence\ns3.bucket.create -name invoices\n' | weed shell -master=s3:9333

volumes:
  pgdata:
  redisdata:
  s3data:
