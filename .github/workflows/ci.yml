name: CI

on:
  push:
    branches: [main, judging-improvements]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crowdshield
          POSTGRES_PASSWORD: crowdshield
          POSTGRES_DB: crowdshield_test
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U crowdshield -d crowdshield_test" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6389:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # test-only values; no real keys are needed (Nebius/Tavily are mocked in tests)
      DATABASE_URL: postgres://crowdshield:crowdshield@localhost:5442/crowdshield_test
      DATABASE_URL_TEST: postgres://crowdshield:crowdshield@localhost:5442/crowdshield_test
      REDIS_URL: redis://localhost:6389
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: cd apps/ml && uv sync --frozen
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
